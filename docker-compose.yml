services:
  advisor:
    build: .
    image: edca-advisor:latest
    container_name: edca_advisor
    restart: unless-stopped
    ports:
      - "8006:8006"
    env_file:
      - .env
    command: ["python3", "-m", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8006"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s




